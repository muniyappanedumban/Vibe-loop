# Load balancer in front of N API replicas (docker-compose.prod.yml). TLS is terminated here or at a cloud LB in front.
# No sticky sessions: WebSocket fan-out and presence go through Redis, so any replica can serve any client.
worker_processes auto;
events { worker_connections 16384; }

http {
  server_tokens off;
  sendfile on; tcp_nopush on; tcp_nodelay on;
  keepalive_timeout 65;
  log_format json escape=json '{"t":"$time_iso8601","ip":"$remote_addr","m":"$request_method","u":"$uri","s":$status,'
                              '"b":$body_bytes_sent,"rt":$request_time,"ut":"$upstream_response_time","up":"$upstream_addr","rid":"$request_id"}';
  access_log /dev/stdout json;

  gzip on; gzip_comp_level 5; gzip_min_length 1024; gzip_proxied any; gzip_vary on;
  gzip_types application/json text/plain text/css application/javascript;

  # Coarse per-IP edge limits; fine-grained per-user/route limits live in the app (Redis-backed).
  limit_req_zone  $binary_remote_addr zone=api:20m  rate=30r/s;
  limit_req_zone  $binary_remote_addr zone=auth:10m rate=10r/s;   # generous: mobile carriers put many users behind one CGNAT IP
  limit_conn_zone $binary_remote_addr zone=conn:10m;
  limit_req_status 429; limit_conn_status 429;

  map $http_upgrade $connection_upgrade { default upgrade; '' ''; }

  upstream api {
    # Docker DNS resolves "api" to every replica; nginx round-robins over the IPs it resolved at start.
    # (Restart/reload nginx after scaling, or use a cloud LB / k8s Service which re-resolves.)
    least_conn;
    server api:8000 max_fails=3 fail_timeout=10s;
    keepalive 128;
  }

  server {
    listen 80;
    client_max_body_size 6m;          # 5 MB resumable chunks + slack (the app enforces exact caps per route)
    client_body_timeout 30s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # app: TRUST_PROXY=1
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s; proxy_read_timeout 35s; proxy_send_timeout 35s;   # > REQUEST_TIMEOUT_SEC (30)
    proxy_next_upstream error timeout http_502 http_503; proxy_next_upstream_tries 2;   # idempotency: nginx won't retry POST after send
    limit_conn conn 50;

    location = /health/live { access_log off; proxy_pass http://api; }

    location /ws {
      proxy_pass http://api;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s; proxy_send_timeout 3600s;   # clients should ping well within this
      proxy_buffering off;
    }

    location /auth/ { limit_req zone=auth burst=20 nodelay; proxy_pass http://api; }

    # Single video uploads (POST /media) are bigger than chunks.
    location = /media { client_max_body_size 51m; proxy_request_buffering off; limit_req zone=api burst=20 nodelay; proxy_pass http://api; }
    location /uploads/ { proxy_request_buffering off; proxy_read_timeout 120s; limit_req zone=api burst=40 nodelay; proxy_pass http://api; }

    location / { limit_req zone=api burst=60 nodelay; proxy_pass http://api; }
  }
}
